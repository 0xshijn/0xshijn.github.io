<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>0xSHIINN // BLOG VIEWER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #030609;
      --nav-bg: rgba(3, 6, 9, 0.88);
      --panel: rgba(10, 18, 28, 0.65);
      --panel2: rgba(0, 255, 157, 0.06);
      --text: #e6f1ff;
      --muted: #7a8fa6;
      --line: rgba(0, 255, 157, 0.18);
      --line-subtle: rgba(255, 255, 255, 0.07);
      --brand: #00ff9d;
      --brand2: #00f0ff;
      --max: 900px;
      --display: "Chakra Petch", sans-serif;
      --mono: "JetBrains Mono", monospace;
      --sans: "Inter", -apple-system, sans-serif;
    }
    .progress-wrap {
      position: fixed; top: 0; left: 0; width: 100%; height: 3px; z-index: 1000; background: rgba(255,255,255,0.04);
    }
    #progress-bar {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, var(--brand), var(--brand2));
      box-shadow: 0 0 12px var(--brand);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --nav-bg: rgba(241, 245, 249, 0.92);
      --panel: #ffffff;
      --panel2: rgba(5, 150, 105, 0.08);
      --text: #090d16;
      --muted: #475569;
      --line: rgba(5, 150, 105, 0.28);
      --line-subtle: rgba(15, 23, 42, 0.1);
      --brand: #059669;
      --brand2: #0284c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      background-color: var(--bg);
      line-height: 1.75;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: linear-gradient(to right, var(--line-subtle) 1px, transparent 1px), linear-gradient(to bottom, var(--line-subtle) 1px, transparent 1px);
      background-size: 64px 64px; pointer-events: none; z-index: 0;
    }

    .nav {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(16px);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      max-width: var(--max); margin: 0 auto; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--display); font-weight: 700; font-size: 1.2rem; color: var(--text); text-decoration: none;
    }
    .brand-mark {
      width: 26px; height: 26px; background: var(--panel2); border: 1px solid var(--brand);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--brand);
    }
    .theme-btn {
      background: transparent; border: 1px solid var(--line); color: var(--text);
      width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }
    .theme-btn .sun { display: none; }
    [data-theme="light"] .theme-btn .sun { display: block; }
    [data-theme="light"] .theme-btn .moon { display: none; }

    .wrap { position: relative; z-index: 2; max-width: var(--max); margin: 0 auto; padding: 36px 24px 80px; }
    .back {
      color: var(--brand); text-decoration: none; font-family: var(--mono); font-size: 12px;
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 28px;
      padding: 7px 14px; background: var(--panel2); border: 1px solid var(--line);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }

    h1#title {
      font-family: var(--display);
      font-size: clamp(28px, 4.5vw, 42px);
      margin: 0 0 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text);
    }
    .post-meta {
      display: flex;
      gap: 18px;
      color: var(--brand2);
      font-size: 0.85rem;
      margin-bottom: 24px;
      font-family: var(--mono);
    }

    .blog-window {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%);
      overflow: hidden;
    }
    .window-header {
      padding: 10px 18px;
      background: rgba(0, 255, 157, 0.06);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .window-header .dot { width: 9px; height: 9px; }
    .window-header .dot-red { background: #ff2a54; }
    .window-header .dot-yellow { background: #ffb800; }
    .window-header .dot-green { background: #00ff9d; }
    .window-title {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--brand);
    }

    #content {
      font-size: 1.08rem;
      padding: 36px 44px;
      min-height: 260px;
      overflow-wrap: anywhere;
    }
    @media (max-width: 600px) {
      #content { padding: 24px 18px; font-size: 1rem; }
      h1#title { font-size: 1.85rem; }
    }
    #content h1, #content h2 { font-family: var(--display); font-size: 1.6rem; margin: 1.8em 0 0.8em; color: var(--brand); font-weight: 700; text-transform: uppercase; }
    #content h3 { font-family: var(--display); font-size: 1.25rem; margin: 1.4em 0 0.8em; color: var(--brand2); }
    #content p { margin-bottom: 1.2em; }

    #content blockquote {
      margin: 20px 0; padding: 12px 20px; color: var(--muted);
      border-left: 3px solid var(--brand); background: var(--panel2); font-style: italic;
    }

    footer { margin-top: 60px; padding: 30px 0; border-top: 1px solid var(--line-subtle); color: var(--muted); text-align: center; font-family: var(--mono); font-size: 12px; }
  </style>
</head>
<body>
  <div class="progress-wrap"><div id="progress-bar"></div></div>

  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="../index.html">
        <span class="brand-mark">0x</span>
        <span>SHIINN // BLOG_VIEWER</span>
      </a>
      <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42m12.72-12.72l1.42-1.42"/></svg>
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <a href="../blog.html" class="back">← CD .. // DAILY_BLOG_ARCHIVE</a>
    <h1 id="title">Loading...</h1>
    <div class="post-meta">
      <span id="post-date">---</span>
      <span id="post-reading-time">---</span>
    </div>

    <div class="blog-window">
      <div class="window-header">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <div class="window-title">~/blog/journal.md</div>
      </div>
      <div id="content"></div>
    </div>
    <footer>© 0xSHIINN // PWN &amp; SECURITY RESEARCH</footer>
  </main>

  <script>
    const currentTheme = localStorage.getItem("theme");
    if (currentTheme) document.documentElement.setAttribute("data-theme", currentTheme);

    document.getElementById("theme-toggle").addEventListener("click", () => {
      let theme = document.documentElement.getAttribute("data-theme");
      if (theme === "light") {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        localStorage.setItem("theme", "light");
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get('file');
    const displayTitle = urlParams.get('title');

    if (fileName) {
      document.getElementById('title').textContent = displayTitle || fileName;
      const dateParam = urlParams.get('date');
      if (dateParam) document.getElementById('post-date').textContent = "DATE // " + dateParam;

      fetch('data/' + fileName)
        .then(response => {
          if (!response.ok) throw new Error('Không tìm thấy bài viết');
          return response.text();
        })
        .then(text => {
          const words = text.trim().split(/\s+/).length;
          const readTime = Math.max(1, Math.ceil(words / 200));
          document.getElementById('post-reading-time').textContent = "READ_TIME // " + readTime + " MIN";
          document.getElementById('content').innerHTML = marked.parse(text);
        })
        .catch(err => {
          document.getElementById('content').innerHTML = `<div style="color:#ff2a54; padding:20px; border:1px solid #ff2a54">ERROR: ${err.message}</div>`;
        });
    }

    window.onscroll = function() {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      document.getElementById("progress-bar").style.width = scrolled + "%";
    };
  </script>
</body>
</html>
