<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>0xSHIINN // PUBLIC PENTEST APIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030609;
      --bg-panel: rgba(10, 18, 28, 0.6);
      --text: #e6f1ff;
      --muted: #7a8fa6;
      --acid: #00ff9d;
      --acid-dim: rgba(0, 255, 157, 0.12);
      --cyan: #00f0ff;
      --emerald: #00ff9d;
      --line: rgba(0, 255, 157, 0.18);
      --line-subtle: rgba(255, 255, 255, 0.07);
      --brand2: #00f0ff;
      --max: 1100px;
      --display: "Chakra Petch", sans-serif;
      --mono: "JetBrains Mono", monospace;
      --sans: "Inter", system-ui, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-panel: rgba(255, 255, 255, 0.85);
      --text: #090d16;
      --muted: #475569;
      --acid: #059669;
      --acid-dim: rgba(5, 150, 105, 0.1);
      --cyan: #0284c7;
      --emerald: #059669;
      --line: rgba(5, 150, 105, 0.28);
      --line-subtle: rgba(15, 23, 42, 0.1);
      --brand2: #0284c7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); color: var(--text); background-color: var(--bg); min-height: 100vh; }
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: linear-gradient(to right, var(--line-subtle) 1px, transparent 1px), linear-gradient(to bottom, var(--line-subtle) 1px, transparent 1px);
      background-size: 64px 64px; pointer-events: none; z-index: 0;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { position: relative; z-index: 2; max-width: var(--max); margin: 0 auto; padding: 36px 24px 80px; }

    .nav {
      position: sticky; top: 0; z-index: 100; backdrop-filter: blur(16px);
      background: rgba(3, 6, 9, 0.86); border-bottom: 1px solid var(--line);
    }
    [data-theme="light"] .nav { background: rgba(241, 245, 249, 0.9); }
    .nav-inner { max-width: var(--max); margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; }
    .brand-mark {
      width: 26px; height: 26px; background: var(--acid-dim); border: 1px solid var(--acid);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--acid);
    }
    .menu { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .menu a {
      padding: 7px 13px; font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }
    .menu a:hover, .menu a.active { color: var(--acid); background: var(--acid-dim); }
    .theme-btn {
      background: transparent; border: 1px solid var(--line); color: var(--text); width: 34px; height: 34px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }
    .theme-btn .sun { display: none; }
    [data-theme="light"] .theme-btn .sun { display: block; }
    [data-theme="light"] .theme-btn .moon { display: none; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--acid);
      margin-bottom: 24px; padding: 7px 14px; border: 1px solid var(--line); background: var(--acid-dim);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }

    .header { margin-bottom: 36px; padding: 16px 0 32px; border-bottom: 1px solid var(--line); }
    .header-kicker { font-family: var(--mono); font-size: 12px; color: var(--acid); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-family: var(--display); font-size: clamp(34px, 5vw, 52px); margin: 0 0 10px; font-weight: 700; text-transform: uppercase; line-height: 1; }
    .header p { color: var(--muted); font-size: 1rem; margin: 0 0 24px; max-width: 60ch; }

    .search-box {
      display: flex; align-items: center; gap: 10px; background: var(--bg-panel); border: 1px solid var(--line); padding: 10px 16px;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }
    .search-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 0.9rem; font-family: var(--mono); }

    .list { display: flex; flex-direction: column; gap: 16px; }
    .item {
      background: var(--bg-panel); border: 1px solid var(--line-subtle); border-left: 3px solid var(--cyan);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
      transition: all 0.25s ease; overflow: hidden;
    }
    .item:hover { border-color: var(--acid); background: rgba(0, 255, 157, 0.04); transform: translateX(4px); }
    .item-header {
      padding: 8px 20px; background: rgba(0, 240, 255, 0.04); border-bottom: 1px solid var(--line-subtle);
      display: flex; align-items: center; justify-content: space-between;
    }
    .item-dots { display: flex; gap: 6px; }
    .item-header .dot { width: 8px; height: 8px; }
    .item-header .dot-red { background: #ff2a54; }
    .item-header .dot-yellow { background: #ffb800; }
    .item-header .dot-green { background: #00ff9d; }
    .item-path { font-family: var(--mono); font-size: 11px; color: var(--cyan); }
    .item-body { padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .item-info h2 { font-family: var(--display); font-size: 1.4rem; font-weight: 700; margin: 6px 0 0; text-transform: uppercase; }
    .badge { padding: 5px 12px; background: var(--acid-dim); border: 1px solid var(--line); font-size: 0.75rem; text-transform: uppercase; font-weight: 700; font-family: var(--mono); }
    .method-badge { padding: 3px 10px; background: var(--acid); color: #020508; font-family: var(--mono); font-size: 0.75rem; font-weight: 700; }
    .copy-ep-btn {
      padding: 6px 12px; border: 1px solid var(--line); background: transparent; color: var(--acid);
      font-family: var(--mono); font-size: 11.5px; cursor: pointer;
    }
    .copy-ep-btn:hover { background: var(--acid); color: #020508; font-weight: 700; }

    .reveal { opacity: 0; transform: translateY(15px); transition: all 0.45s ease; }
    .reveal.show { opacity: 1; transform: none; }
    footer { margin-top: 64px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 12px; border-top: 1px solid var(--line-subtle); padding-top: 24px; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">0x</span>
        <span>SHIINN // PUBLIC APIS</span>
      </a>
      <nav class="menu">
        <a href="index.html">Home</a>
        <a href="writeups.html">Writeups</a>
        <a href="projects.html">Projects</a>
        <a href="blog.html">Blog</a>
        <a href="api.html" class="active">APIs</a>
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
          <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42m12.72-12.72l1.42-1.42"/></svg>
          <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a href="index.html" class="back-btn">← CD .. // RETURN_TO_BASE</a>

    <header class="header reveal">
      <div class="header-kicker">// SECTOR_02 : PUBLIC_ENDPOINTS</div>
      <h1>Public Pentest APIs</h1>
      <p>Các điểm cuối API và công cụ dòng lệnh trực tuyến hỗ trợ tra cứu dữ liệu bảo mật.</p>
      <div class="search-box">
        <span style="color:var(--acid); font-family:var(--mono)">&gt;_</span>
        <input id="api-search" type="text" placeholder="Search endpoint (e.g. /api/v1/ip)..." autocomplete="off" />
      </div>
    </header>

    <div class="list" id="api-list"></div>

    <footer>© <span id="year"></span> 0xSHIINN // PWN &amp; SECURITY RESEARCH</footer>
  </main>

  <script src="api/list.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const currentTheme = localStorage.getItem("theme");
    if (currentTheme) document.documentElement.setAttribute("data-theme", currentTheme);
    document.getElementById("theme-toggle").addEventListener("click", () => {
      let theme = document.documentElement.getAttribute("data-theme");
      if (theme === "light") {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        localStorage.setItem("theme", "light");
      }
    });
  </script>
</body>
</html>
