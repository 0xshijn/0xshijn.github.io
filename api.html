<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shiinn | Public APIs</title>
  <style>
    :root{
      --bg: #05070a;
      --nav-bg: rgba(5,7,10,0.8);
      --panel: rgba(255,255,255,0.03);
      --panel2: rgba(255,255,255,0.06);
      --text: #f0f2f5;
      --muted: #94a3b8;
      --line: rgba(255,255,255,0.08);
      --brand: #a855f7;
      --brand2: #06b6d4;
      --shadow: 0 10px 40px rgba(0,0,0,0.6);
      --radius: 20px;
      --max: 900px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --grad-start: #fff;
      --grad-end: var(--brand2);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --nav-bg: rgba(248,250,252,0.9);
      --panel: #ffffff;
      --panel2: #f1f5f9;
      --text: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      --shadow: 0 10px 40px rgba(0,0,0,0.06);
      --grad-start: #7c3aed;
      --grad-end: #0891b2;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(168,85,247,0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6,182,212,0.1), transparent 40%);
      overflow-x:hidden;
      min-height: 100vh;
    }

    [data-theme="light"] body {
      --bg-grad-1: rgba(124,58,237,0.06);
      --bg-grad-2: rgba(8,145,178,0.06);
    }

    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding:40px 20px 80px}

    .nav{
      position:sticky; top:0; z-index:100;
      backdrop-filter: blur(20px);
      background: var(--nav-bg);
      border-bottom:1px solid var(--line);
    }
    .nav-inner{
      max-width:var(--max); margin:0 auto; padding:16px 20px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      font-weight:800; font-size: 1.1rem; letter-spacing:-0.5px;
    }
    .dot{
      width:12px; height:12px; border-radius:50%;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow: 0 0 15px rgba(168,85,247,0.4);
    }
    .menu{display:flex; gap:12px; align-items:center}
    .theme-btn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      width: 40px; height: 40px; border-radius: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .theme-btn:hover { background: var(--panel2); transform: translateY(-2px); }
    .theme-btn .sun { display: none; }
    [data-theme="light"] .theme-btn .sun { display: block; }
    [data-theme="light"] .theme-btn .moon { display: none; }

    .header { margin-bottom: 40px; text-align: center; }
    h1 { font-size: 2.5rem; margin: 0 0 10px; font-weight: 800; letter-spacing: -1px; }
    .grad {
      background: linear-gradient(135deg, var(--grad-start) 30%, var(--grad-end));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .header p { color: var(--muted); font-size: 1.1rem; }

    .list { display: flex; flex-direction: column; gap: 16px; }
    .item {
      padding: 0; border-radius: var(--radius);
      background: var(--panel); border: 1px solid var(--line);
      display: flex; flex-direction: column;
      transition: all 0.3s ease; box-shadow: var(--shadow);
      overflow: hidden;
    }
    .item-header {
      padding: 12px 16px; background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--line); display: flex; gap: 6px;
    }
    .item-header .dot { width: 10px; height: 10px; border-radius: 50%; opacity: 0.6; }
    .item-header .dot-red { background: #ff5f56; }
    .item-header .dot-yellow { background: #ffbd2e; }
    .item-header .dot-green { background: #27c93f; }

    .item-body {
      padding: 24px; display: flex; justify-content: space-between; align-items: center;
    }
    .item:hover { border-color: var(--brand2); transform: translateY(-5px); background: var(--panel2); }
    .item:hover .item-header .dot { opacity: 1; }

    .item-info h2 { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
    .badge {
      padding: 4px 10px; border-radius: 6px; background: var(--line);
      font-size: 0.75rem; text-transform: uppercase; font-weight: 700;
      font-family: var(--mono);
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); margin-bottom: 24px; font-weight: 500;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--text); }

    .reveal{opacity:0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1)}
    .reveal.show{opacity:1; transform:none}

    footer { margin-top: 60px; text-align: center; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--line); padding-top: 24px; }
  </style>
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <div class="dot"></div>
        <span>Shiinn</span>
      </a>
      <div class="menu">
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
          <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42m12.72-12.72l1.42-1.42"/></svg>
          <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <main class="wrap">
    <a href="index.html" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Quay lại
    </a>

    <header class="header reveal">
      <h1><span class="grad">Public APIs</span></h1>
      <p>Các điểm cuối API mình đã xây dựng và chia sẻ cho cộng đồng.</p>
    </header>

    <div class="list" id="api-list">
      <!-- Tự động render -->
    </div>

    <footer> © <span id="year"></span> Shiinn </footer>
  </main>

  <script src="api/list.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const currentTheme = localStorage.getItem("theme");
    if (currentTheme) document.documentElement.setAttribute("data-theme", currentTheme);
    document.getElementById("theme-toggle").addEventListener("click", () => {
      let theme = document.documentElement.getAttribute("data-theme");
      if (theme === "light") {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
        localStorage.setItem("theme", "light");
      }
    });
  </script>
</body>
</html>
