<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shiinn | Writeup Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root{
      --bg: #0d1117;
      --panel: #161b22;
      --text: #c9d1d9;
      --muted: #8b949e;
      --line: #30363d;
      --brand2: #58a6ff;
      --max: 850px;
      --mono: "JetBrains Mono", monospace;
      --sans: "Inter", -apple-system, sans-serif;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --text: #24292f;
      --muted: #57606a;
      --line: #d0d7de;
      --brand2: #0969da;
    }
    body { margin: 0; font-family: var(--sans); color: var(--text); background: var(--bg); line-height: 1.6; }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 40px 20px; }
    .back { color: var(--brand2); text-decoration: none; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 40px; opacity: 0.8; transition: 0.2s; }
    .back:hover { opacity: 1; transform: translateX(-4px); }
    
    h1#title { font-size: 2.2rem; margin: 0 0 30px; letter-spacing: -1px; font-weight: 800; color: var(--text); }

    /* Markdown Styling */
    #content { 
      font-size: 1.05rem; 
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    #content h1, #content h2 { font-size: 1.5rem; margin: 2em 0 1em; color: var(--brand2); border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
    #content h3 { font-size: 1.2rem; margin: 1.5em 0 1em; }
    #content p { margin-bottom: 1.2em; }
    
    /* Lời tự sự / Ghi chú */
    #content blockquote {
      margin: 20px 0;
      padding: 1px 20px;
      color: var(--muted);
      border-left: 4px solid var(--brand2);
      background: var(--panel);
      border-radius: 0 8px 8px 0;
      font-style: italic;
    }

    /* CodeSnap Style */
    .codesnap-container {
      margin: 32px 0;
      padding: 50px;
      background: linear-gradient(135deg, #6e7681 0%, #3b424e 100%);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }
    [data-theme="light"] .codesnap-container { background: linear-gradient(135deg, #d1d5db 0%, #9ca3af 100%); }

    .codesnap-window {
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .codesnap-header {
      padding: 16px;
      background: #1e1e1e;
      display: flex;
      gap: 8px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .codesnap-content {
      display: flex;
      padding: 0 0 20px 0;
      font-family: var(--mono);
      font-size: 0.95rem;
      line-height: 1.5;
      overflow-x: auto;
    }
    .line-numbers {
      padding: 20px 16px;
      text-align: right;
      color: #858585;
      user-select: none;
      border-right: 1px solid #333;
      margin-right: 16px;
      background: rgba(0,0,0,0.2);
    }
    .line-numbers pre { margin: 0; padding: 0; }
    .code-area {
      flex: 1;
      color: #d4d4d4;
      padding: 20px 20px 20px 0;
    }
    .code-area pre { margin: 0; padding: 0; background: transparent; }
    .code-area code { background: transparent !important; padding: 0 !important; color: inherit !important; }
    
    /* Syntax Highlighting Tweaks */
    .hljs { background: transparent !important; }
    
    /* Inline Code */
    #content :not(pre) > code { 
      font-family: var(--mono); background: var(--panel); 
      color: var(--brand2); padding: 3px 6px; border-radius: 6px; font-size: 0.9em; 
    }

    #content .img-wrapper {
      margin: 40px auto;
      text-align: center;
      max-width: 70%;
    }
    #content img { 
      width: 100%; 
      height: auto;
      border-radius: 12px; 
      border: 1px solid var(--line); 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    #content .img-caption {
      display: block;
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      font-style: italic;
    }
    
    footer { margin-top: 80px; padding: 40px 0; border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <a href="../writeups.html" class="back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Quay lại danh sách
    </a>

    <h1 id="title">Loading...</h1>
    <div id="content"></div>

    <footer>© Shiinn</footer>
  </main>

  <script>
    const currentTheme = localStorage.getItem("theme");
    if (currentTheme) document.documentElement.setAttribute("data-theme", currentTheme);

    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get('file');
    const displayTitle = urlParams.get('title');

    if (fileName) {
      document.getElementById('title').textContent = displayTitle || fileName;
      
      fetch('data/' + fileName)
        .then(response => {
          if (!response.ok) throw new Error('Không tìm thấy file writeup');
          return response.text();
        })
        .then(text => {
          const renderer = new marked.Renderer();
          
          renderer.code = function(arg1, arg2) {
            // Xử lý linh hoạt cho các phiên bản marked.js khác nhau
            let code = "";
            let lang = "";

            if (typeof arg1 === 'string') {
              code = arg1;
              lang = arg2 || '';
            } else if (arg1 && typeof arg1 === 'object') {
              code = arg1.text || "";
              lang = arg1.lang || "";
            }

            let highlighted = "";
            try {
              if (lang && hljs.getLanguage(lang)) {
                highlighted = hljs.highlight(code, { language: lang }).value;
              } else {
                highlighted = hljs.highlightAuto(code).value;
              }
            } catch (e) {
              highlighted = code; // Fallback nếu highlight lỗi
            }

            const lines = code.trim().split('\n');
            const lineNumbers = lines.map((_, i) => i + 1).join('\n');

            return `
              <div class="codesnap-container">
                <div class="codesnap-window">
                  <div class="codesnap-header">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                  </div>
                  <div class="codesnap-content">
                    <div class="line-numbers"><pre>${lineNumbers}</pre></div>
                    <div class="code-area">
                      <pre><code class="hljs language-${lang}">${highlighted}</code></pre>
                    </div>
                  </div>
                </div>
              </div>
            `;
          };

          renderer.image = function(arg1, arg2, arg3) {
            let href = "";
            let text = "";
            
            if (typeof arg1 === 'string') {
              href = arg1;
              text = arg3 || "";
            } else if (arg1 && typeof arg1 === 'object') {
              href = arg1.href || "";
              text = arg1.text || "";
            }

            return `
              <div class="img-wrapper">
                <img src="${href}" alt="${text}">
                ${text ? `<span class="img-caption">${text}</span>` : ''}
              </div>
            `;
          };

          document.getElementById('content').innerHTML = marked.parse(text, { renderer: renderer });
        })
        .catch(err => {
          document.getElementById('content').innerHTML = `<div style="color:#ff5f56; padding:20px; background:rgba(255,95,86,0.1); border-radius:12px">Lỗi: ${err.message}</div>`;
        });
    }
  </script>
</body>
</html>
